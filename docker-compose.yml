services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-test
    ports:
      - "5000:5000"
    environment:
      APP_VERSION: "1.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
